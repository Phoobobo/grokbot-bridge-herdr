# ~/.config/grokbot-bridge-herdr/config.toml   (chmod 600 — gbb refuses to send otherwise)
# Copy:  mkdir -p ~/.config/grokbot-bridge-herdr && cp config.example.toml ~/.config/grokbot-bridge-herdr/config.toml && chmod 600 ~/.config/grokbot-bridge-herdr/config.toml

# Grok Bot routine webhook URL (shown in the routine's trigger panel).
webhook_url = ""

# Auth header Grok Bot expects. Copy the exact header name and the key from the routine panel.
webhook_header_name = ""
webhook_header_value = ""

# Seconds before the background POST gives up (never blocks Herdr).
webhook_timeout_sec = 5

# Repeated identical `blocked` events within this window are dropped.
debounce_sec = 15

# Seconds to let the agent TUI settle after `herdr agent start` before the first prompt.
startup_settle_sec = 4

# Seconds to wait (after the settle) for the agent's input box to be drawn and the screen to stop changing
# before the first prompt is typed. Codex can report "ready" while its splash is still animating and drops input.
startup_ready_timeout_sec = 90

# Optional per-kind default agent args for `gbb launch` (single line, double-quoted strings, JSON-style escapes).
# Used only when launch is called without `-- <agent args>`; an explicit `--` (even with nothing after it) wins.
# Each item is passed to the agent as one argument, so values with quotes/spaces are safe.
# Empty or absent = the agent's own defaults (for codex: ~/.codex/config.toml).
# codex_args = ["-m", "gpt-6.1-sol", "-c", "model_reasoning_effort=\"xhigh\""]
# grok_args = []

# Optional: only allow `gbb launch` in repos under these paths (single line). Empty = any git repo.
# allowed_repos = ["~/Workspace", "~/herdr-bridge-test"]

# Optional extra receivers that get the identical payload (e.g. a local dots-bridge, see README "dots").
# Must come AFTER all keys above (TOML tables end the top level). Max 5. Header is sent via curl stdin.
# [[extra_webhooks]]
# url = "http://127.0.0.1:8765/herdr/webhook"
# header_name = "X-Dots-Herdr-Token"
# header_value = ""   # contents of ~/.config/dots-bridge/herdr_webhook_token

# Env overrides: GBB_WEBHOOK_URL, GBB_WEBHOOK_HEADER_NAME, GBB_WEBHOOK_HEADER_VALUE, GBB_CONFIG,
# GBB_STATE_DIR (default ~/.local/state/grokbot-bridge-herdr), GBB_DATA_DIR (default ~/.local/share/grokbot-bridge-herdr)
