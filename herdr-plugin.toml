id = "phoobobo.bot-as-collie"
name = "BotAsCollie"
version = "1.0.0"
min_herdr_version = "0.9.0"
description = "Let BotAsCollie drive and watch agent panes: status webhooks, managed-pane registry, handover/reclaim"
platforms = ["macos", "linux"]

# Status changes of managed panes -> webhook to Grok Bot (done / idle / blocked only).
[[events]]
on = "pane.agent_status_changed"
command = ["/bin/sh", "bin/bac", "hook"]

# Forget managed panes that close so the registry never points at a reused pane id.
[[events]]
on = "pane.closed"
command = ["/bin/sh", "bin/bac", "hook"]

[[actions]]
id = "handover"
title = "BotAsCollie: take over this pane"
contexts = ["pane"]
command = ["/bin/sh", "bin/bac", "action", "handover"]

[[actions]]
id = "reclaim"
title = "BotAsCollie: give this pane back to me"
contexts = ["pane"]
command = ["/bin/sh", "bin/bac", "action", "reclaim"]
