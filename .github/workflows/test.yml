name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck jq
      - name: shellcheck
        run: shellcheck -s sh -S warning -e SC2088,SC1010 bin/bac contracts/bac/v1/migrate-fixture.sh tests/bac-contract-test.sh tests/dots-disabled-test.sh tests/scoped-routing-test.sh install.sh uninstall.sh
      # Never invoke the aggregate runner: it includes prohibited lock,
      # process-kill and concurrency probes. New checks require explicit review.
      - name: Offline contract and fixture migration
        run: sh tests/bac-contract-test.sh
      - name: Shell syntax
        run: sh -n bin/bac
      - name: Python syntax (without importing or executing the helper)
        run: python3 -c 'import ast, pathlib; ast.parse(pathlib.Path("bin/bac-lock").read_text())'
      - name: Disabled Dots and scoped backend routing (stubs)
        run: |
          sh tests/dots-disabled-test.sh
          sh tests/scoped-routing-test.sh
